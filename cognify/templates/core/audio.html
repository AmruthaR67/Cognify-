{% extends "core/base.html" %}

{% block content %}

<div class="audio-page">

    <a href="{% url 'workspace' notebook.id %}" class="back-link">
        ← Back to Workspace
    </a>

    <div class="audio-card">

        <div class="audio-header">
            <div class="audio-icon">
                🔊
            </div>

            <div>
                <h1>Audio Overview</h1>
                <p>{{ notebook.name }}</p>
            </div>
        </div>

        <div class="audio-player">

            <div class="audio-circle">
                ▶
            </div>

            <div class="audio-info">
                <strong>{{ notebook.name }}</strong>
                <span>AI Audio Overview</span>
            </div>

        </div>

        <h2>Overview</h2>

        <div class="audio-script">
            {{ result.content|linebreaks }}
        </div>

        <div class="audio-actions">

            <button
                type="button"
                class="audio-button"
                onclick="speakAudio()"
            >
                ▶ Play Audio
            </button>

            <button
                type="button"
                class="audio-button secondary"
                onclick="stopAudio()"
            >
                ■ Stop
            </button>

        </div>

    </div>

</div>


<style>

.audio-page {
    min-height: calc(100vh - 60px);
    padding: 35px;
    background: #f8f9fc;
}

.audio-card {
    max-width: 850px;
    margin: 25px auto;
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.audio-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.audio-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: #eee9ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.audio-header h1 {
    margin: 0;
}

.audio-header p {
    margin: 5px 0 0;
    color: #777;
}

.audio-player {
    background: #151b4f;
    color: white;
    border-radius: 16px;
    padding: 25px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.audio-circle {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #7657e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.audio-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.audio-info span {
    color: #c8c8d8;
    font-size: 14px;
}

.audio-card h2 {
    margin-bottom: 15px;
}

.audio-script {
    line-height: 1.7;
    color: #444;
    background: #f7f7fb;
    padding: 20px;
    border-radius: 12px;
}

.audio-actions {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.audio-button {
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    background: #6246d8;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.audio-button.secondary {
    background: #eeeeee;
    color: #333;
}

</style>


<script>

function speakAudio() {

    const text = `
        {{ result.content|escapejs }}
    `;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 0.95;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}


function stopAudio() {

    window.speechSynthesis.cancel();

}

</script>

{% endblock %}
