{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Cognify{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'core/style.css' %}">

    <!-- Apply saved theme before the page appears -->
    <script>

        (function () {

            const theme =
                localStorage.getItem("cognify-theme");

            if (theme === "dark") {

                document.documentElement
                    .setAttribute("data-theme", "dark");

            }

            else if (theme === "light") {

                document.documentElement
                    .setAttribute("data-theme", "light");

            }

            else if (theme === "system") {

                const dark =
                    window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches;

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        dark ? "dark" : "light"
                    );

            }

            else {

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        "light"
                    );

            }

        })();

    </script>

</head>


<body>

    <!-- Your existing header/sidebar stays here -->

    {% block navigation %}
    {% endblock %}


    {% if messages %}

        <div class="messages-container">

            {% for message in messages %}

                <div class="message message-{{ message.tags }}">

                    {{ message }}

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

        <p>
            © 2026 Cognify. All rights reserved.
        </p>

    </footer>


    <!-- GLOBAL THEME -->

    <script>

        function applyCognifyTheme(theme) {

            let actualTheme = theme;


            if (theme === "system") {

                actualTheme =
                    window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches
                    ? "dark"
                    : "light";

            }


            document.documentElement
                .setAttribute(
                    "data-theme",
                    actualTheme
                );


            localStorage.setItem(
                "cognify-theme",
                theme
            );


            /*
             * Update theme buttons if they
             * exist on the Settings page.
             */

            document
                .querySelectorAll(".theme-button")
                .forEach(function (button) {

                    button.classList.remove(
                        "selected"
                    );


                    if (
                        button.dataset.theme === theme
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }

                });

        }


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                let theme =
                    localStorage.getItem(
                        "cognify-theme"
                    );


                if (
                    theme !== "light" &&
                    theme !== "dark" &&
                    theme !== "system"
                ) {

                    theme = "light";

                }


                applyCognifyTheme(theme);


                /*
                 * Settings theme buttons
                 */

                document
                    .querySelectorAll(".theme-button")
                    .forEach(function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                applyCognifyTheme(
                                    button.dataset.theme
                                );

                            }
                        );

                    });

            }
        );


        /*
         * System theme changes
         */

        window
            .matchMedia(
                "(prefers-color-scheme: dark)"
            )
            .addEventListener(
                "change",
                function () {

                    const theme =
                        localStorage.getItem(
                            "cognify-theme"
                        );


                    if (theme === "system") {

                        applyCognifyTheme(
                            "system"
                        );

                    }

                }
            );

    </script>


</body>

</html>
